{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Tienda</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'inventario/app.css' %}" rel="stylesheet">
</head>
<body class="auth">
  <div class="auth-card">
    <div class="auth-head"><i class="bi bi-box-seam"></i><h1>Inventario de la tienda</h1></div>
    <div class="auth-body">
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>{% endif %}
        <div class="mb-3"><label class="form-label" for="id_username">Usuario</label>
          <input id="id_username" name="username" class="form-control" autofocus required></div>
        <div class="mb-3"><label class="form-label" for="id_password">Contraseña</label>
          <input id="id_password" name="password" type="password" class="form-control" required></div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100">Entrar</button>
      </form>
    </div>
  </div>
</body>
</html>
